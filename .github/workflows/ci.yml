# Key-free checks on every pull request and on pushes to main. Nothing here calls a model provider: the live smoke
# test and live evaluation cost money and need an API key, so they stay manual (npm run smoke:live / eval:fixtures).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never pick up a provider configuration, even if one were present in the checkout.
  PROXIMAL_ENV_FILE: none
  LLM_MODE: mock

jobs:
  check:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  e2e:
    name: Browser tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Builds the app and starts two offline servers (normal and fault-injection); see playwright.config.ts.
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
